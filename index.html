<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cup Checker</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  #preview { max-width: 100%; max-height: 300px; display: none; margin: 12px 0; border-radius: 8px; }
  #result { font-size: 1.3rem; font-weight: bold; margin-top: 20px; min-height: 1.6em; }
  .cup { color: #1a7f37; }
  .notcup { color: #c62828; }
  .loading { color: #555; }
  #debug { font-size: 0.8rem; color: #888; white-space: pre-wrap; margin-top: 20px; }
</style>
</head>
<body>

<h1>Cup Checker</h1>
<p>Upload an image. We'll tell you if it's a cup.</p>

<input type="file" id="fileInput" accept="image/*">
<img id="preview" alt="preview">
<div id="result"></div>
<div id="debug"></div>

<script>
// Your deployed Cloudflare Worker — no /workers.js path
const WORKER_URL = "https://weathered-cell-9bcd.zeeshan40u.workers.dev/";

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const resultEl = document.getElementById("result");
const debugEl = document.getElementById("debug");

function compressAndEncode(file, maxSize = 800, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxSize || height > maxSize) {
        if (width > height) {
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else {
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
    };
    img.onerror = () => reject(new Error("Could not read the image file."));
    img.src = URL.createObjectURL(file);
  });
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;

  resultEl.textContent = "";
  resultEl.className = "";
  debugEl.textContent = "";
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  if (location.protocol === "file:") {
    debugEl.textContent =
      "⚠️ Running from file://\n" +
      "Some browsers block fetch() from local files.\n" +
      "Serve over http:// for reliable testing.\n\n";
  }

  try {
    resultEl.textContent = "Compressing image…";
    resultEl.className = "loading";

    const base64 = await compressAndEncode(file);
    debugEl.textContent += "Base64 length: " + base64.length + " chars\n";
    debugEl.textContent += "Sending to: " + WORKER_URL + "\n\n";

    resultEl.textContent = "Analyzing…";

    let response;
    try {
      response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64 }),
      });
    } catch (networkErr) {
      debugEl.textContent +=
        "❌ Network error before the server replied.\n\n" +
        "Possible causes:\n" +
        "1. Worker still running the Hello World template (no CORS).\n" +
        "2. Worker URL is wrong.\n" +
        "3. You are opening this page from file:// (use http://).\n" +
        "4. Network/browser blocking the request.\n\n" +
        "Raw error: " + networkErr.message;
      resultEl.textContent = "Cannot reach the Worker (see debug).";
      resultEl.className = "notcup";
      return;
    }

    if (!response.ok) {
      const errText = await response.text();
      debugEl.textContent += "Worker returned " + response.status + ":\n" + errText;
      resultEl.textContent = "Worker error " + response.status + " (see debug).";
      resultEl.className = "notcup";
      return;
    }

    const data = await response.json();
    debugEl.textContent += "Worker response:\n" + JSON.stringify(data, null, 2);

    const predictions = data.predictions || [];
    const hasCup = predictions.some(p =>
      (p.class || "").toLowerCase().includes("cup")
    );

    if (hasCup) {
      resultEl.textContent = "Cup";
      resultEl.className = "cup";
    } else {
      resultEl.textContent = "Its Not A Cup, -100 credit";
      resultEl.className = "notcup";
    }
  } catch (err) {
    resultEl.textContent = "Error: " + err.message;
    resultEl.className = "notcup";
    debugEl.textContent += "\n" + err.stack;
  }
});
</script>

</body>
</html>
