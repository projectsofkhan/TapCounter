<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeeshan Khan — Private Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d11;
      --card-bg: rgba(15, 23, 42, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --error: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b0d11 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .gate-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 1.5rem;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .gate-header { text-align: center; margin-bottom: 2rem; }
    .gate-header h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; }
    .gate-header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--text-muted); margin-bottom: 0.4rem;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    input {
      width: 100%; background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border); border-radius: 0.75rem;
      padding: 0.75rem 1rem; color: var(--text); font-size: 0.95rem; outline: none;
      transition: all 0.2s ease;
    }
    input:focus { border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08); }
    .passwords-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .submit-btn {
      width: 100%; margin-top: 1.5rem; background: #f8fafc; color: #0b0d11;
      border: none; padding: 0.85rem; border-radius: 0.75rem;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease;
    }
    .submit-btn:hover { background: #e2e8f0; transform: translateY(-1px); }
    .alert-msg {
      margin-top: 1rem; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.85rem;
      text-align: center; display: none; background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3); color: var(--error);
    }
  </style>
</head>
<body>
  <div class="gate-container">
    <div class="gate-header">
      <h1>Private Space</h1>
      <p>Verification required to access Zeeshan Khan's space.</p>
    </div>

    <form id="gate-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="input-name" placeholder="Full Name" required />
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="input-username" placeholder="Username" required />
      </div>

      <div class="form-group">
        <label>Passkeys (Any order)</label>
        <div class="passwords-grid">
          <input type="password" id="pass-1" placeholder="Passkey 1" required />
          <input type="password" id="pass-2" placeholder="Passkey 2" required />
          <input type="password" id="pass-3" placeholder="Passkey 3" required />
          <input type="password" id="pass-4" placeholder="Passkey 4" required />
        </div>
      </div>

      <button type="submit" class="submit-btn">Unlock Space</button>
      <div id="gate-alert" class="alert-msg"></div>
    </form>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    const VALID_NAME = "Zeeshan Khan";
    const REQUIRED_KEYS = [
      "king630707",
      "kingfc0g0g",
      "King-630707",
      "2655198114"
    ].sort();

    let attempts = 0;
    const MAX_ATTEMPTS = 5;

    document.getElementById('gate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('gate-alert');
      
      const enteredName = document.getElementById('input-name').value.trim();
      const enteredUsername = document.getElementById('input-username').value.trim();
      const enteredKeys = [
        document.getElementById('pass-1').value.trim(),
        document.getElementById('pass-2').value.trim(),
        document.getElementById('pass-3').value.trim(),
        document.getElementById('pass-4').value.trim()
      ].sort();

      const nameMatches = (enteredName === VALID_NAME);
      const usernameValid = enteredUsername.length > 0;
      const keysMatch = (
        enteredKeys.length === REQUIRED_KEYS.length &&
        enteredKeys.every((key, idx) => key === REQUIRED_KEYS[idx])
      );

      if (nameMatches && usernameValid && keysMatch) {
        // Mark session unlocked and proceed to Home
        sessionStorage.setItem('zk_space_unlocked', 'true');
        sessionStorage.setItem('zk_user', enteredUsername);
        window.location.href = 'home.html';
      } else {
        attempts++;
        if (attempts >= MAX_ATTEMPTS) {
          document.querySelector('.gate-container').innerHTML = `
            <div style="text-align: center; color: var(--error); padding: 2rem 0;">
              <h3>Access Permanently Locked</h3>
              <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.5rem;">Maximum attempts exceeded.</p>
            </div>`;
        } else {
          alertBox.style.display = 'block';
          alertBox.innerText = `Invalid credentials. (${MAX_ATTEMPTS - attempts} attempts left)`;
        }
      }
    });
  </script>
</body>
</html>
